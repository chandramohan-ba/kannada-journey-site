ss=\"sb-card\"><h3 class=\"sb-card__title\">Practical, real-life Kannada<\/h3><p>Learn sentences and expressions that fit your daily routines and interactions, not abstract grammar drills.<\/p><\/div>\n            <div class=\"sb-card\"><h3 class=\"sb-card__title\">Guided progression<\/h3><p>Move through programs in a logical order, with each stage building on the previous one.<\/p><\/div>\n            <div class=\"sb-card\"><h3 class=\"sb-card__title\">Comfortable pace<\/h3><p>Take your time. The materials are designed so you can revisit and reinforce without feeling rushed.<\/p><\/div>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Kannada lives in clinics, cafés, markets, yoga spaces, and homes. That is where we will practise.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“So I can take my time, and use what I learn the very same day.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Stage 1\" id=\"stage-1\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"stage1\" data-alt=\"Stage one: Anand traces a Kannada letter on a slate while Rahul points to himself\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-kicker\">How the journey unfolds<\/p>\n          <p class=\"sb-lead\">The pathway is organised into six programs, grouped into three stages. Each stage builds on the previous one.<\/p>\n          <p class=\"sb-chapter\">Stage 1 of 3<\/p>\n          <h2 class=\"sb-heading\">Programs 1–2<\/h2>\n          <p class=\"sb-lead\"><strong>First spoken sentences and everyday use.<\/strong><br>Begin with simple spoken patterns and extend Kannada across practical everyday situations and relationships.<\/p>\n          <h3 class=\"sb-subhead\">You will be able to<\/h3>\n          <ul class=\"sb-bullets\"><li>Read and write the Kannada letters.<\/li><li>Say what you do, ask questions, say what you won’t do, and politely ask others to do things.<\/li><li>Talk about anyone and anything: people, places, things, yesterday, today and tomorrow.<\/li><\/ul>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Stage one, then. Speak first, worry later?”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Exactly. Speak first. The rules will follow.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Stage 2\" id=\"stage-2\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"stage2\" data-alt=\"Stage two: Anand and Rahul sit on a straw mat in a library veranda, with a slate linking spoken and written Kannada\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Stage 2 of 3<\/p>\n          <h2 class=\"sb-heading\">Programs 3–4<\/h2>\n          <p class=\"sb-lead\"><strong>How Kannada works and clearer expression of actions.<\/strong><br>Understand how sentences are built and how spoken and written forms relate. Learn to express actions that are ongoing, completed, or experienced.<\/p>\n          <h3 class=\"sb-subhead\">You will be able to<\/h3>\n          <ul class=\"sb-bullets\"><li>See how everyday spoken Kannada turns into correct written Kannada.<\/li><li>Build the right word forms yourself, instead of memorising each one.<\/li><li>Say what is happening now, what is finished, and what you have experienced.<\/li><\/ul>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Now I want to know why it works.”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Then it is time to see the map behind your words.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Stage 3\" id=\"stage-3\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"stage3\" data-alt=\"Stage three: Rahul performs on a stage before a red curtain while Anand claps in the front row\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Stage 3 of 3<\/p>\n          <h2 class=\"sb-heading\">Programs 5–6<\/h2>\n          <p class=\"sb-lead\"><strong>Richer conversations and real-world expression.<\/strong><br>Go beyond simple sentences with advanced structures for natural spoken and written Kannada. Expand vocabulary through themes, newspapers, films, news, roleplay, discussion, and real-world practice.<\/p>\n          <h3 class=\"sb-subhead\">You will be able to<\/h3>\n          <ul class=\"sb-bullets\"><li>Understand and make longer, richer sentences.<\/li><li>Join words and sentences smoothly, in speech and in writing.<\/li><li>Grow a wide vocabulary through newspapers, films, news, roleplay, acting and discussion.<\/li><\/ul>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“And after that?”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“After that, you step onto the stage and perform.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Join\" id=\"join\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"finale\" data-alt=\"The village gate with a welcoming lamp, and Anand and Rahul waving\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h2 class=\"sb-heading\">Ready to walk the path?<\/h2>\n          <p class=\"sb-lead\">From first words to real belonging.<\/p>\n          <div class=\"sb-actions\">\n            <a class=\"sb-btn\" href=\"programs.html\">View all programs<\/a>\n            <a class=\"sb-btn sb-btn--ghost\" href=\"contact.html\">Ask about joining<\/a>\n          <\/div>\n          <button class=\"sb-link\" type=\"button\" data-sb-first>Read the story again<\/button>\n        <\/div>\n      <\/section>\n\n    <\/div>\n\n    \n    <nav class=\"sb-controls\" aria-label=\"Storybook pages\">\n      <button class=\"sb-turn\" type=\"button\" data-sb-prev aria-label=\"Previous page\">‹<\/button>\n      <ol class=\"sb-dots\" id=\"sbDots\"><\/ol>\n      <button class=\"sb-turn\" type=\"button\" data-sb-next aria-label=\"Next page\">›<\/button>\n    <\/nav>\n    <p class=\"sb-counter\" id=\"sbCounter\" aria-live=\"polite\"><\/p>\n  ", "everyday-kannada.html": "\n    <div class=\"sb-book\" id=\"sbBook\" tabindex=\"-1\">\n\n      \n      <section class=\"sb-spread\" data-title=\"Everyday life\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"ev0\" data-alt=\"A signpost with four arrows: People and places, Daily needs, Work and study, Health and safety\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h1 class=\"sb-title\">Kannada for everyday life<\/h1>\n          <p class=\"sb-lead\">Learn Kannada you can actually use while travelling, shopping, working, studying, and talking with your community.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>Rahul steps out to practise where life actually happens. Anand points to four arrows on the signpost.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Four places where Kannada really lives: with people, in daily needs, at work and study, and when health or safety is at stake.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Then that is where I’ll practise.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"People and places\" id=\"people\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"evPeople\" data-alt=\"Rahul asks a neighbour for directions in Kannada and she points straight ahead\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Everyday scene 1<\/p>\n          <h2 class=\"sb-heading\">People and places<\/h2>\n          <p class=\"sb-lead\">Greetings, introductions, and directions.<\/p>\n          <ul class=\"sb-phrases\" aria-label=\"Words from the scene\">\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Namaskara<\/span><span class=\"sb-phrase__en\">Hello<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Nimma hesarenu?<\/span><span class=\"sb-phrase__en\">What is your name?<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Idu ellide?<\/span><span class=\"sb-phrase__en\">Where is this?<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Nera hogi<\/span><span class=\"sb-phrase__en\">Go straight<\/span><\/li>\n          <\/ul>\n          <p class=\"sb-focus\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          \n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Start with people: greetings, introductions, directions. One sentence at a time.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“I just asked for directions, and she answered in Kannada!”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Daily needs\" id=\"daily\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"evDaily\" data-alt=\"At a fruit stall Rahul asks how much something costs and the vendor answers, with a chalkboard of Kannada numbers\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Everyday scene 2<\/p>\n          <h2 class=\"sb-heading\">Daily needs<\/h2>\n          <p class=\"sb-lead\">Shopping, prices, food, numbers, and travel.<\/p>\n          <ul class=\"sb-phrases\" aria-label=\"Words from the scene\">\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Idu eshtu?<\/span><span class=\"sb-phrase__en\">How much is this?<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Ippattu roopaayi<\/span><span class=\"sb-phrase__en\">Twenty rupees<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Ondu, eradu, mooru<\/span><span class=\"sb-phrase__en\">One, two, three<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Neeru kodi<\/span><span class=\"sb-phrase__en\">Please give me water<\/span><\/li>\n          <\/ul>\n          <p class=\"sb-focus\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Prices and numbers are the heartbeat of the market. Ask, listen, and count along.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“I asked the price and understood the answer. Twenty rupees!”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Work and study\" id=\"work\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"evWork\" data-alt=\"In a classroom Rahul asks his teacher to say something again, and she agrees, with a blackboard behind them\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Everyday scene 3<\/p>\n          <h2 class=\"sb-heading\">Work and study<\/h2>\n          <p class=\"sb-lead\">Questions, requests, and everyday interaction.<\/p>\n          <ul class=\"sb-phrases\" aria-label=\"Words from the scene\">\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Matte heli, dayavittu<\/span><span class=\"sb-phrase__en\">Please say it again<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Artha aagalilla<\/span><span class=\"sb-phrase__en\">I did not understand<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Sahaaya maadteera?<\/span><span class=\"sb-phrase__en\">Will you help me?<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Khandita<\/span><span class=\"sb-phrase__en\">Certainly<\/span><\/li>\n          <\/ul>\n          <p class=\"sb-focus\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“At work or in class, you will need to ask for help and ask people to repeat. Asking is part of learning.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“I can say I didn’t understand, politely, and they happily explain again.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Health and safety\" id=\"health\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"evHealth\" data-alt=\"At a pharmacy counter Rahul says he has a stomach ache and the pharmacist reassures him\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Everyday scene 4<\/p>\n          <h2 class=\"sb-heading\">Health and safety<\/h2>\n          <p class=\"sb-lead\">Basic phrases for comfort, help, and emergencies.<\/p>\n          <ul class=\"sb-phrases\" aria-label=\"Words from the scene\">\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Hotte novu<\/span><span class=\"sb-phrase__en\">Stomach ache<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Chinte beda<\/span><span class=\"sb-phrase__en\">Don’t worry<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Sahaaya maadi!<\/span><span class=\"sb-phrase__en\">Help!<\/span><\/li>\n            <li class=\"sb-phrase\"><span class=\"sb-phrase__kn\">Vaidyaru beku<\/span><span class=\"sb-phrase__en\">I need a doctor<\/span><\/li>\n          <\/ul>\n          <p class=\"sb-focus\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“These are phrases for comfort, help, and emergencies. Learn them early, and hope you never need the last one.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Just knowing them makes me feel safer.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Join\" id=\"join\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"finale\" data-alt=\"The village gate with a welcoming lamp, and Anand and Rahul waving\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h2 class=\"sb-heading\">Useful Kannada, growing confidence.<\/h2>\n          <p class=\"sb-lead\">The goal is not perfect grammar on day one. The goal is useful Kannada with growing confidence.<\/p>\n          <div class=\"sb-actions\">\n            <a class=\"sb-btn\" href=\"programs.html\">Explore programs<\/a>\n            <a class=\"sb-btn sb-btn--ghost\" href=\"contact.html\">Ask about joining<\/a>\n          <\/div>\n          <button class=\"sb-link\" type=\"button\" data-sb-first>Read the story again<\/button>\n        <\/div>\n      <\/section>\n\n    <\/div>\n\n    \n    <nav class=\"sb-controls\" aria-label=\"Storybook pages\">\n      <button class=\"sb-turn\" type=\"button\" data-sb-prev aria-label=\"Previous page\">‹<\/button>\n      <ol class=\"sb-dots\" id=\"sbDots\"><\/ol>\n      <button class=\"sb-turn\" type=\"button\" data-sb-next aria-label=\"Next page\">›<\/button>\n    <\/nav>\n    <p class=\"sb-counter\" id=\"sbCounter\" aria-live=\"polite\"><\/p>\n  ", "about.html": "\n    <div class=\"sb-book\" id=\"sbBook\" tabindex=\"-1\">\n\n      \n      <section class=\"sb-spread\" data-title=\"The house\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"about0\" data-alt=\"Anand stands in the doorway of a small house with a lamp lit on each side and a sign reading Kannada Payana, Kannada Journey, while Rahul arrives\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h1 class=\"sb-title\">About Kannada Journey<\/h1>\n          <p class=\"sb-lead\">Kannada Journey is a practical learning pathway for people who want more than textbook phrases: to speak, understand, and feel more connected in everyday life in Karnataka.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>At the end of the lane stands a small house with a lamp always lit. This is where the journey begins.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Welcome. Kannada Journey is for people who want more than textbook phrases.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“I once memorised phrases for months and still couldn’t talk to my neighbour.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Our approach\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"about1\" data-alt=\"A tree whose roots are labelled Simple spoken patterns and whose crown is labelled Deeper understanding, with Anand watering it and Rahul looking up\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <h2 class=\"sb-heading\">Our approach<\/h2>\n          <p class=\"sb-lead\">Begin with simple spoken patterns and grow toward deeper understanding and expression. Language becomes meaningful when it helps people connect.<\/p>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“See the tree? Its roots are simple spoken patterns. Understanding and expression grow from them.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“So the words only matter when they connect me to someone.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Get in touch\" id=\"join\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"finale\" data-alt=\"The village gate with a welcoming lamp, and Anand and Rahul waving\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h2 class=\"sb-heading\">Walk with us.<\/h2>\n          <p class=\"sb-lead\">From first words to real belonging.<\/p>\n          <div class=\"sb-actions\">\n            <a class=\"sb-btn\" href=\"contact.html\">Get in touch<\/a>\n            <a class=\"sb-btn sb-btn--ghost\" href=\"programs.html\">Explore programs<\/a>\n          <\/div>\n          <button class=\"sb-link\" type=\"button\" data-sb-first>Read the story again<\/button>\n        <\/div>\n      <\/section>\n\n    <\/div>\n\n    \n    <nav class=\"sb-controls\" aria-label=\"Storybook pages\">\n      <button class=\"sb-turn\" type=\"button\" data-sb-prev aria-label=\"Previous page\">‹<\/button>\n      <ol class=\"sb-dots\" id=\"sbDots\"><\/ol>\n      <button class=\"sb-turn\" type=\"button\" data-sb-next aria-label=\"Next page\">›<\/button>\n    <\/nav>\n    <p class=\"sb-counter\" id=\"sbCounter\" aria-live=\"polite\"><\/p>\n  ", "contact.html": "\n    <div class=\"sb-book\" id=\"sbBook\" tabindex=\"-1\">\n\n      \n      <section class=\"sb-spread\" data-title=\"The guest book\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"contact0\" data-alt=\"Rahul signs the guest book on a table at the door of a house while Anand asks his name in Kannada\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h1 class=\"sb-title\">Start your Kannada Journey<\/h1>\n          <p class=\"sb-lead\">Tell us a little about yourself and what you would like to learn.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>Before every journey, Anand asks each traveller to sign the guest book at the door.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Before we begin, tell me who is walking this road.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“I’ll sign my name, and then tell you what I hope to learn.”<\/p><\/div>\n          <\/div>\n          <button class=\"sb-btn sb-btn--start\" type=\"button\" data-sb-next>Sign the guest book<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Enquiry form\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"finale\" data-alt=\"The village gate with a welcoming lamp, and Anand and Rahul waving\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <h2 class=\"sb-heading\">Sign the guest book<\/h2>\n          <form class=\"sb-form\" id=\"sbEnquiry\" action=\"#\" method=\"post\" novalidate>\n            <div class=\"sb-form__row\"><div class=\"sb-field\"><label for=\"sb-name\">Full name<\/label><input id=\"sb-name\" name=\"name\" type=\"text\" required autocomplete=\"name\"><\/div><div class=\"sb-field\"><label for=\"sb-email\">Email address<\/label><input id=\"sb-email\" name=\"email\" type=\"email\" required autocomplete=\"email\"><\/div><\/div>\n            <div class=\"sb-form__row\"><div class=\"sb-field\"><label for=\"sb-phone\">Phone (optional)<\/label><input id=\"sb-phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\"><\/div><div class=\"sb-field\"><label for=\"sb-role\">I am a<\/label><select id=\"sb-role\" name=\"role\" required><option value=\"\" disabled selected>Select one<\/option><option>Medical/Nursing student<\/option><option>Yoga practitioner<\/option><option>IT professional<\/option><option>New learner<\/option><option>Other<\/option><\/select><\/div><\/div>\n            <div class=\"sb-form__row\"><div class=\"sb-field\"><label for=\"sb-level\">Current Kannada level<\/label><select id=\"sb-level\" name=\"level\" required><option value=\"\" disabled selected>Select one<\/option><option>Complete beginner<\/option><option>Some knowledge<\/option><option>Understand but cannot speak<\/option><option>Other<\/option><\/select><\/div><div class=\"sb-field\"><label for=\"sb-mode\">Preferred mode<\/label><select id=\"sb-mode\" name=\"mode\"><option>Not sure<\/option><option>Online<\/option><option>Offline<\/option><option>Either<\/option><\/select><\/div><\/div>\n            <div class=\"sb-field\"><label for=\"sb-goal\">What would you like to achieve?<\/label><textarea id=\"sb-goal\" name=\"goal\" rows=\"3\" required><\/textarea><\/div>\n            <div class=\"sb-field\"><label for=\"sb-message\">Additional message<\/label><textarea id=\"sb-message\" name=\"message\" rows=\"3\"><\/textarea><\/div>\n            <div class=\"sb-hp\" aria-hidden=\"true\"><label for=\"sb-website\">Website<\/label><input id=\"sb-website\" name=\"website\" type=\"text\" tabindex=\"-1\" autocomplete=\"off\"><\/div>\n            <p class=\"sb-consent\">By submitting, you agree to be contacted about your enquiry. Do not send sensitive medical or personal information.<\/p>\n            <button class=\"sb-btn\" type=\"submit\">Send enquiry<\/button>\n            <p class=\"sb-status\" id=\"sbEnquiryStatus\" role=\"status\" aria-live=\"polite\"><\/p>\n          <\/form>\n        <\/div>\n      <\/section>\n\n    <\/div>\n\n    \n    <nav class=\"sb-controls\" aria-label=\"Storybook pages\">\n      <button class=\"sb-turn\" type=\"button\" data-sb-prev aria-label=\"Previous page\">‹<\/button>\n      <ol class=\"sb-dots\" id=\"sbDots\"><\/ol>\n      <button class=\"sb-turn\" type=\"button\" data-sb-next aria-label=\"Next page\">›<\/button>\n    <\/nav>\n    <p class=\"sb-counter\" id=\"sbCounter\" aria-live=\"polite\"><\/p>\n  "};
function showPage(name) {
  var m = document.querySelector(".sb-stage");
  m.innerHTML = PAGES[name];
  var links = document.querySelectorAll(".sb-topnav a");
  for (var i = 0; i < links.length; i++) {
    if (links[i].getAttribute("href") === name && !links[i].hasAttribute("data-real")) links[i].setAttribute("aria-current", "page");
    else links[i].removeAttribute("aria-current");
  }
  window.scrollTo(0, 0);
  window.sbInit();
}
document.addEventListener("click", function (e) {
  var a = e.target.closest ? e.target.closest("a[href]") : null;
  if (!a) return;
  var h = a.getAttribute("href");
    if (PAGES[h] && !a.hasAttribute("data-real")) { e.preventDefault(); showPage(h); }
});
showPage("index.html");
</script>
