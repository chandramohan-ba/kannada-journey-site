/* =====================================================================
   KANNADA JOURNEY: STORYBOOK STYLES (ONE FILE FOR ALL SEVEN PAGES)
   Paste this ONCE at the very END of your existing styles.css.
   If you pasted any earlier storybook CSS, delete that first, so the
   storybook styles appear only once.
   Every class starts with .sb- so nothing clashes with your own CSS.
   ===================================================================== */

/* =====================================================================
   KANNADA JOURNEY: STORYBOOK PROGRAMS PAGE
   Paste this at the END of your existing styles.css.
   Every class starts with .sb- so nothing clashes with your other pages.
   Change the colours in :root to restyle the whole book.
   ===================================================================== */

:root {
  --sb-desk:      #3a2210;
  --sb-desk-2:    #281607;
  --sb-paper:     #f2dfb3;
  --sb-paper-2:   #e8cf98;
  --sb-ink:       #3a2210;
  --sb-ink-soft:  #6b4a2b;
  --sb-red:       #b5301d;
  --sb-gold:      #dd9b16;
  --sb-green:     #44703a;
  --sb-indigo:    #27386b;
  --sb-display:   "Yatra One", "Noto Serif Kannada", Georgia, serif;
  --sb-body-font: "Lora", "Noto Serif Kannada", Georgia, serif;
}

.sb-body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--sb-ink);
  font-family: var(--sb-body-font);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(221,155,22,.18), transparent 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 7px),
    linear-gradient(var(--sb-desk), var(--sb-desk-2));
}
.sb-body *, .sb-body *::before, .sb-body *::after { box-sizing: border-box; }

/* ---------- Top bar ---------- */
.sb-topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .5rem 1.5rem;
  padding: .8rem clamp(1rem, 4vw, 2.5rem);
  background: rgba(20, 10, 3, .55);
  border-bottom: 2px solid var(--sb-gold);
}
.sb-brand {
  font-family: var(--sb-display);
  font-size: 1.35rem;
  color: var(--sb-gold);
  text-decoration: none;
}
.sb-topnav { display: flex; flex-wrap: wrap; gap: .25rem 1.1rem; }
.sb-topnav a {
  color: #f2dfb3;
  text-decoration: none;
  font-size: .95rem;
  padding: .25rem 0;
  border-bottom: 2px solid transparent;
}
.sb-topnav a:hover,
.sb-topnav a[aria-current="page"] { border-bottom-color: var(--sb-gold); }
.sb-topbar a:focus-visible { outline: 3px solid var(--sb-gold); outline-offset: 3px; }

/* ---------- Stage ---------- */
.sb-stage {
  flex: 1;
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  padding: clamp(1rem, 3vw, 2rem) clamp(.5rem, 3vw, 1.5rem) 1rem;
}

/* ---------- Book ---------- */
.sb-book {
  position: relative;
  border-radius: 10px;
  background: var(--sb-paper);
  box-shadow:
    0 0 0 6px #7a4a22,
    0 0 0 9px var(--sb-gold),
    0 0 0 11px #7a4a22,
    0 30px 60px rgba(0,0,0,.55);
  outline: none;
}

.sb-spread {
  display: none;
  grid-template-columns: 1fr 1fr;
  align-items: stretch;
  min-height: 560px;
  perspective: 1800px;
  position: relative;
}
.sb-spread.is-active { display: grid; }

.sb-spread::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 56px;
  transform: translateX(-50%);
  pointer-events: none;
  background: linear-gradient(90deg,
    transparent, rgba(80,45,10,.28) 45%, rgba(80,45,10,.4) 50%, rgba(80,45,10,.28) 55%, transparent);
}

.sb-page {
  position: relative;
  padding: clamp(1.2rem, 3vw, 2.2rem);
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(150,95,30,.18), transparent 50%),
    var(--sb-paper);
}
.sb-page--art {
  border-radius: 10px 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sb-page--text {
  border-radius: 0 10px 10px 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: .9rem;
  transform-origin: left center;
  backface-visibility: hidden;
}

/* inner ruled border */
.sb-page::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 2px solid var(--sb-red);
  outline: 1px solid var(--sb-red);
  outline-offset: -7px;
  border-radius: 6px;
  pointer-events: none;
  opacity: .55;
}

/* ---------- Art ---------- */
.sb-art {
  position: relative;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}
.sb-art svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 480 / 440;
  border-radius: 10px;
  border: 3px solid var(--sb-ink);
  box-shadow: 0 6px 16px rgba(58,34,16,.35);
}
.sb-art img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 560px;
  object-fit: contain;
  border-radius: 10px;
  border: 3px solid var(--sb-ink);
  box-shadow: 0 6px 16px rgba(58,34,16,.35);
}

/* Shown only if storybook.js has not loaded: tells you what is wrong */
.sb-art__fallback {
  margin: 0;
  padding: 2rem 1.2rem;
  text-align: center;
  font-style: italic;
  line-height: 1.5;
  color: var(--sb-ink-soft);
  border: 3px dashed var(--sb-red);
  border-radius: 10px;
  background: rgba(181,48,29,.07);
}

.sb-svg-text { font-family: var(--sb-body-font); }

/* ---------- Typography ---------- */
.sb-kicker,
.sb-chapter {
  margin: 0;
  font-family: var(--sb-display);
  font-size: 1.05rem;
  color: var(--sb-red);
  letter-spacing: .04em;
}
.sb-chapter::before { content: "❖ "; color: var(--sb-gold); }

.sb-title,
.sb-heading {
  margin: 0;
  font-family: var(--sb-display);
  font-weight: 400;
  color: var(--sb-indigo);
  line-height: 1.2;
}
.sb-title   { font-size: clamp(1.45rem, 3vw, 2.05rem); }
.sb-heading { font-size: clamp(1.4rem, 2.8vw, 2rem); }
.sb-heading__main { display: block; }
.sb-heading__sub {
  display: block;
  margin-top: .3rem;
  font-family: var(--sb-body-font);
  font-style: italic;
  font-size: .62em;
  color: var(--sb-red);
}

.sb-lead {
  margin: 0;
  font-size: clamp(1rem, 1.5vw, 1.12rem);
  line-height: 1.65;
  max-width: 36em;
}
.sb-focus {
  margin: 0;
  font-size: .92rem;
  line-height: 1.5;
  color: var(--sb-ink-soft);
}
.sb-focus strong { color: var(--sb-green); }

/* Narrator scroll */
.sb-scroll {
  position: relative;
  padding: .7rem 1.1rem;
  background: #fbefc8;
  border-top: 3px solid #b8923f;
  border-bottom: 3px solid #b8923f;
  border-radius: 6px;
  box-shadow: inset 0 0 14px rgba(150,95,30,.2);
  max-width: 36em;
}
.sb-scroll p { margin: 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: var(--sb-ink-soft); }
.sb-scroll .sb-scroll__label {
  margin-bottom: .2rem;
  font-style: normal;
  font-family: var(--sb-display);
  font-size: .9rem;
  color: var(--sb-red);
  letter-spacing: .04em;
}

/* Dialogue */
.sb-dialogue { display: grid; gap: .7rem; max-width: 36em; }
.sb-line {
  position: relative;
  padding: .65rem .9rem .7rem;
  border: 2px solid var(--sb-ink);
  border-radius: 14px;
  line-height: 1.55;
  font-size: .96rem;
}
.sb-line p { margin: 0; }
.sb-who {
  display: inline-block;
  margin-bottom: .2rem;
  padding: .05rem .6rem;
  font-family: var(--sb-display);
  font-size: .85rem;
  color: #fff7e2;
  border-radius: 999px;
}
.sb-line--anand { background: #fff7e2; margin-right: 1.5rem; border-bottom-left-radius: 2px; }
.sb-line--anand .sb-who { background: var(--sb-red); }
.sb-line--rahul { background: #e3ecf8; margin-left: 1.5rem; border-bottom-right-radius: 2px; }
.sb-line--rahul .sb-who { background: var(--sb-indigo); }

.sb-story {
  margin: .3rem 0 0;
  padding: .8rem 1rem;
  font-style: italic;
  line-height: 1.6;
  color: var(--sb-ink-soft);
  background: rgba(221,155,22,.16);
  border-left: 4px solid var(--sb-gold);
  border-radius: 0 8px 8px 0;
  max-width: 36em;
}

.sb-route {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: .7rem;
}
.sb-route li {
  padding: .6rem .9rem;
  border: 2px dashed var(--sb-green);
  border-radius: 8px;
  line-height: 1.5;
}
.sb-route li span { display: block; font-family: var(--sb-display); color: var(--sb-green); }

/* ---------- Buttons ---------- */
.sb-actions { display: flex; flex-wrap: wrap; gap: .8rem; }
.sb-btn {
  display: inline-block;
  padding: .75rem 1.4rem;
  font-family: var(--sb-display);
  font-size: 1.05rem;
  color: #fff7e2;
  background: var(--sb-red);
  border: 2px solid #7d1c0e;
  border-radius: 999px;
  box-shadow: 0 3px 0 #7d1c0e;
  text-decoration: none;
  cursor: pointer;
  align-self: flex-start;
}
.sb-btn:hover { background: #cc3a25; }
.sb-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d1c0e; }
.sb-btn--ghost {
  color: var(--sb-indigo);
  background: transparent;
  border-color: var(--sb-indigo);
  box-shadow: 0 3px 0 var(--sb-indigo);
}
.sb-btn--ghost:hover { background: rgba(39,56,107,.1); }
.sb-link {
  align-self: flex-start;
  padding: 0;
  font: inherit;
  font-style: italic;
  color: var(--sb-ink-soft);
  background: none;
  border: 0;
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- Controls ---------- */
.sb-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-top: 1.8rem;
}
.sb-turn {
  width: 48px;
  height: 48px;
  font-size: 1.8rem;
  line-height: 1;
  color: var(--sb-ink);
  background: var(--sb-gold);
  border: 2px solid #7a4a22;
  border-radius: 50%;
  cursor: pointer;
}
.sb-turn:hover:not(:disabled) { background: #f1b43a; }
.sb-turn:disabled { opacity: .35; cursor: default; }

.sb-dots {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .55rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.sb-dots button {
  width: 18px;
  height: 18px;
  padding: 0;
  background: transparent;
  border: 2px solid var(--sb-gold);
  border-radius: 50%;
  cursor: pointer;
}
.sb-dots button[aria-current="true"] { background: var(--sb-gold); transform: scale(1.25); }

.sb-counter {
  margin: .8rem 0 0;
  text-align: center;
  font-style: italic;
  color: #e8cf98;
}
.sb-footer {
  padding: 1rem;
  text-align: center;
  color: #e8cf98;
  background: rgba(20,10,3,.55);
  border-top: 2px solid var(--sb-gold);
}

.sb-body button:focus-visible,
.sb-body a:focus-visible { outline: 3px solid var(--sb-indigo); outline-offset: 3px; }
.sb-controls button:focus-visible { outline-color: #fff; }

/* ---------- Page-turn animation ---------- */
@keyframes sbTurnNext {
  from { transform: rotateY(-80deg); opacity: .2; }
  to   { transform: rotateY(0);      opacity: 1; }
}
@keyframes sbTurnPrev {
  from { transform: rotateY(60deg);  opacity: .2; }
  to   { transform: rotateY(0);      opacity: 1; }
}
@keyframes sbFade { from { opacity: 0; } to { opacity: 1; } }

.sb-spread.sb-go-next .sb-page--text { animation: sbTurnNext .7s ease both; }
.sb-spread.sb-go-prev .sb-page--text { animation: sbTurnPrev .7s ease both; }
.sb-spread.sb-go-next .sb-page--art,
.sb-spread.sb-go-prev .sb-page--art  { animation: sbFade .7s ease both; }

/* ---------- Mobile: picture on top, text below ---------- */
@media (max-width: 800px) {
  .sb-spread { grid-template-columns: 1fr; min-height: 0; }
  .sb-spread::after { display: none; }
  .sb-page--art  { border-radius: 10px 10px 0 0; padding-bottom: .6rem; }
  .sb-page--text { border-radius: 0 0 10px 10px; }
  .sb-topbar { justify-content: center; text-align: center; }
  .sb-topnav { justify-content: center; }
  .sb-dots { max-width: 220px; }
  .sb-line--anand { margin-right: .5rem; }
  .sb-line--rahul { margin-left: .5rem; }
}

@media (prefers-reduced-motion: reduce) {
  .sb-spread.sb-go-next .sb-page--text,
  .sb-spread.sb-go-prev .sb-page--text,
  .sb-spread.sb-go-next .sb-page--art,
  .sb-spread.sb-go-prev .sb-page--art { animation: none; }
}


/* =====================================================================
   KANNADA JOURNEY: EXTRA STORYBOOK STYLES FOR THE OTHER PAGES
   Paste this at the very END of styles.css, AFTER the storybook-styles.css
   block you already added for the Programs page.
   (Home, Who It's For, How It Works, Everyday Kannada, About)
   ===================================================================== */

/* A third speaker: guests such as Meera, Arjun, Sofia and Neha */
.sb-line--guest { background: #e6f1df; margin-left: 1.5rem; border-bottom-right-radius: 2px; }
.sb-line--guest .sb-who { background: var(--sb-green); }

.sb-lead strong { color: var(--sb-green); font-family: var(--sb-display); font-weight: 400; }

/* ---------- Three little cards ---------- */
.sb-cards { display: grid; gap: .6rem; max-width: 36em; }
.sb-card {
  padding: .6rem .9rem .7rem;
  background: #fff7e2;
  border: 2px dashed var(--sb-green);
  border-radius: 10px;
}
.sb-card__title {
  margin: 0 0 .15rem;
  font-family: var(--sb-display);
  font-weight: 400;
  font-size: 1.05rem;
  color: var(--sb-red);
}
.sb-card p { margin: 0; font-size: .94rem; line-height: 1.5; }

/* ---------- Tab-like chips that jump to a page ---------- */
.sb-tabs { display: flex; flex-wrap: wrap; gap: .5rem; max-width: 36em; }
.sb-tab {
  padding: .45rem .9rem;
  font: inherit;
  font-size: .9rem;
  color: var(--sb-indigo);
  background: #fff7e2;
  border: 2px solid var(--sb-indigo);
  border-radius: 999px;
  cursor: pointer;
}
.sb-tab:hover { background: var(--sb-indigo); color: #fff7e2; }

/* ---------- Two lists side by side ---------- */
.sb-twocol {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .8rem;
  max-width: 38em;
}
.sb-list {
  padding: .6rem .8rem;
  background: rgba(68,112,58,.09);
  border-left: 4px solid var(--sb-green);
  border-radius: 0 8px 8px 0;
}
.sb-list__title {
  margin: 0 0 .3rem;
  font-family: var(--sb-display);
  font-weight: 400;
  font-size: .95rem;
  color: var(--sb-green);
}
.sb-list ul { margin: 0; padding-left: 1.1rem; }
.sb-list li { margin-bottom: .25rem; font-size: .88rem; line-height: 1.45; }

/* ---------- Kannada phrase chips (Everyday Kannada) ---------- */
.sb-phrases {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .5rem;
  margin: 0;
  padding: 0;
  list-style: none;
  max-width: 36em;
}
.sb-phrase {
  padding: .5rem .7rem;
  background: #fff7e2;
  border: 2px solid var(--sb-gold);
  border-radius: 10px;
  line-height: 1.3;
}
.sb-phrase__kn { display: block; font-size: 1.1rem; font-weight: 600; color: var(--sb-indigo); }
.sb-phrase__en { display: block; font-size: .82rem; font-style: italic; color: var(--sb-ink-soft); }

@media (max-width: 800px) {
  .sb-twocol { grid-template-columns: 1fr; }
  .sb-line--guest { margin-left: .5rem; }
}
@media (max-width: 420px) {
  .sb-phrases { grid-template-columns: 1fr; }
}

/* =====================================================================
   CONTACT PAGE: the enquiry form
   ===================================================================== */
.sb-form { display: grid; gap: .7rem; max-width: 38em; }
.sb-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
.sb-field { display: grid; gap: .2rem; }
.sb-field label {
  font-family: var(--sb-display);
  font-size: .88rem;
  color: var(--sb-green);
}
.sb-field input,
.sb-field select,
.sb-field textarea {
  width: 100%;
  padding: .5rem .65rem;
  font: inherit;
  font-size: .95rem;
  color: var(--sb-ink);
  background: #fffaf0;
  border: 2px solid var(--sb-ink-soft);
  border-radius: 8px;
}
.sb-field textarea { min-height: 4.2rem; resize: vertical; }
.sb-field input:focus,
.sb-field select:focus,
.sb-field textarea:focus { outline: 3px solid var(--sb-gold); outline-offset: 1px; border-color: var(--sb-red); }

/* Spam trap: hidden from people, visible to simple bots */
.sb-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.sb-consent { margin: 0; font-size: .82rem; line-height: 1.45; color: var(--sb-ink-soft); }
.sb-status { margin: 0; padding: .6rem .9rem; border-radius: 8px; line-height: 1.5; }
.sb-status:empty { display: none; }
.sb-status--info  { background: rgba(221,155,22,.18); border-left: 4px solid var(--sb-gold); }
.sb-status--ok    { background: rgba(68,112,58,.16);  border-left: 4px solid var(--sb-green); }
.sb-status--error { background: rgba(181,48,29,.14);  border-left: 4px solid var(--sb-red); }
.sb-btn:disabled { opacity: .6; cursor: default; }

@media (max-width: 560px) {
  .sb-form__row { grid-template-columns: 1fr; }
}

/* =====================================================================
   PROGRAMS PAGE: Anand's slate, taglines and "what you will learn" lists
   ===================================================================== */
.sb-tagline {
  margin: 0;
  font-style: italic;
  font-size: 1.02rem;
  color: var(--sb-red);
}
.sb-subhead {
  margin: .3rem 0 0;
  font-family: var(--sb-display);
  font-weight: 400;
  font-size: 1.05rem;
  color: var(--sb-green);
}
.sb-bullets {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: .4rem;
  max-width: 36em;
}
.sb-bullets li {
  position: relative;
  padding-left: 1.5rem;
  font-size: .95rem;
  line-height: 1.5;
}
.sb-bullets li::before {
  content: "✦";
  position: absolute;
  left: 0;
  top: 0;
  color: var(--sb-gold);
}
.sb-btn--small { padding: .5rem 1.1rem; font-size: .95rem; }

/* The chalk slate Anand uses to show examples */
.sb-slate {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 1.1rem 1.3rem 1.3rem;
  color: #f6efd9;
  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.06), transparent 50%),
    #2b312c;
  border: 10px solid #7a4a22;
  border-radius: 10px;
  box-shadow: inset 0 0 30px rgba(0,0,0,.55), 0 6px 16px rgba(58,34,16,.35);
}
.sb-slate__title {
  margin: 0;
  font-family: var(--sb-display);
  font-size: 1.3rem;
  color: #f4d27a;
}
.sb-slate__sub {
  margin: .1rem 0 .7rem;
  font-style: italic;
  font-size: .9rem;
  color: #cfc9b0;
}
.sb-slate__list { margin: 0; padding: 0; list-style: none; display: grid; gap: .1rem; }
.sb-slate__list li { padding: .4rem 0; border-bottom: 1px dashed rgba(246,239,217,.28); }
.sb-slate__list li:last-child { border-bottom: 0; }
.sb-slate__kn { display: block; font-size: 1.15rem; font-weight: 600; line-height: 1.4; }
.sb-slate__en { display: block; font-size: .86rem; font-style: italic; color: #e8d79a; }

.sb-slate__note {
  margin: .8rem 0 0;
  font-size: .8rem;
  font-style: italic;
  color: #cfc9b0;
}

</style>

var INK = "#3a2210";

function fig(x, y, s, o) {

    } else {
      g += '<ellipse cx="0" cy="-12" rx="50" ry="14" fill="' + low + '" stroke="' + INK + '" stroke-width="2.6"/>';
    }
    g += '<path d="M-21 -78 Q0 -86 21 -78 L28 -16 L-28 -16 Z" fill="' + top + '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"/>';

  function arm(side, h) {

/* Rolled scroll tag with text */
function scrollTag(x, y, w, h, text, size, fill) {

function stall(x, y, w, c1, fruitColors) {

/* ---------------------------------------------------------------------
   Fills each picture slot: your image if set, otherwise the drawing.
   --------------------------------------------------------------------- */
(function () {
  function drawing(slot) {
    var make = SCENES[slot] || SCENES.cover;
    return make();
  }

  function fillSlots() {
    var slots = document.querySelectorAll(".sb-art[data-slot]");
    for (var i = 0; i < slots.length; i++) {
      (function (el) {
        var slot = el.getAttribute("data-slot");
        var alt = el.getAttribute("data-alt") || "";
        var src = IMAGES[slot];
        function useDrawing() {
          el.innerHTML = drawing(slot);
          el.setAttribute("role", "img");
          el.setAttribute("aria-label", alt);
        }
        if (src) {
          var img = new Image();
          img.alt = alt;
          img.onerror = useDrawing;
          img.src = src;
          el.innerHTML = "";
          el.appendChild(img);
        } else {
          useDrawing();
        }
      })(slots[i]);
    }
  }

  /* ------------------------------------------------------------------
     3) PAGE-TURNING
     ------------------------------------------------------------------ */
  function initBook() {
    var book = document.getElementById("sbBook");
    if (!book) return;

    var spreads = book.querySelectorAll(".sb-spread");
    var dotsBox = document.getElementById("sbDots");
    var counter = document.getElementById("sbCounter");
    var prevBtns = document.querySelectorAll("[data-sb-prev]");
    var nextBtns = document.querySelectorAll("[data-sb-next]");
    var firstBtns = document.querySelectorAll("[data-sb-first]");
    var total = spreads.length;
    var current = -1;
    var dotButtons = [];
    var d, p, n, f;

    for (d = 0; d < total; d++) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Go to page " + (d + 1) + ": " + spreads[d].getAttribute("data-title"));
      (function (index) {
        b.addEventListener("click", function () { go(index); });
      })(d);
      li.appendChild(b);
      dotsBox.appendChild(li);
      dotButtons.push(b);
    }

    function go(index, silent) {
      if (index < 0 || index >= total || index === current) return;
      var dir = index > current ? "sb-go-next" : "sb-go-prev";
      for (var i = 0; i < total; i++) {
        spreads[i].classList.remove("is-active", "sb-go-next", "sb-go-prev");
      }
      current = index;
      spreads[current].classList.add("is-active");
      if (!silent) spreads[current].classList.add(dir);
      update();
      if (!silent) {
        try {
          history.replaceState(null, "", "#" + (spreads[current].id || "page-" + (current + 1)));
        } catch (err) { /* address-bar update is optional */ }
      }
    }

    function update() {
      var i;
      for (i = 0; i < total; i++) {
        if (i === current) dotButtons[i].setAttribute("aria-current", "true");
        else dotButtons[i].removeAttribute("aria-current");
      }
      for (i = 0; i < prevBtns.length; i++) prevBtns[i].disabled = current === 0;
      for (i = 0; i < nextBtns.length; i++) {
        if (nextBtns[i].classList.contains("sb-turn")) nextBtns[i].disabled = current === total - 1;
      }
      counter.textContent = "Page " + (current + 1) + " of " + total + " · " + spreads[current].getAttribute("data-title");
    }

    for (p = 0; p < prevBtns.length; p++) prevBtns[p].addEventListener("click", function () { go(current - 1); });
    for (n = 0; n < nextBtns.length; n++) nextBtns[n].addEventListener("click", function () { go(current + 1); });
    for (f = 0; f < firstBtns.length; f++) firstBtns[f].addEventListener("click", function () { go(0); });

    /* any button with data-sb-goto="3" jumps to that page (counting from 0) */
    var gotoBtns = document.querySelectorAll("[data-sb-goto]");
    for (var g = 0; g < gotoBtns.length; g++) {
      (function (btn) {
        btn.addEventListener("click", function () { go(parseInt(btn.getAttribute("data-sb-goto"), 10)); });
      })(gotoBtns[g]);
    }

    window.sbKeyHandler = function (e) {
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.key === "ArrowRight") go(current + 1);
      else if (e.key === "ArrowLeft") go(current - 1);
    };
    if (!window.sbKeyBound) {
      window.sbKeyBound = true;
      document.addEventListener("keydown", function (e) { if (window.sbKeyHandler) window.sbKeyHandler(e); });
    }

    var startX = null, startY = null;
    book.addEventListener("touchstart", function (e) {
      startX = e.changedTouches[0].clientX;
      startY = e.changedTouches[0].clientY;
    }, { passive: true });
    book.addEventListener("touchend", function (e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      startX = startY = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? current + 1 : current - 1);
    }, { passive: true });

    /* open directly on a chapter, e.g. programs.html#program-3 */
    var start = 0;
    var hash = window.location.hash.replace("#", "");
    if (hash) {
      for (var s = 0; s < total; s++) {
        if (spreads[s].id === hash) { start = s; break; }
      }
    }
    go(start, true);
  }

  /* ------------------------------------------------------------------
     ENQUIRY FORM (only on contact.html)
     ------------------------------------------------------------------ */
  function initEnquiry() {
    var form = document.getElementById("sbEnquiry");
    if (!form) return;
    var box = document.getElementById("sbEnquiryStatus");
    var btn = form.querySelector("button[type=submit]");

    function say(text, kind) {
      box.textContent = text;
      box.className = "sb-status sb-status--" + kind;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (form.website && form.website.value) return;           /* spam trap: real people leave it empty */
      if (form.reportValidity && !form.reportValidity()) return;

      if (!ENQUIRY.endpoint) {
        say("Thank you for your interest! We are not collecting enquiries just yet. Please visit again soon.", "info");
        return;
      }

      btn.disabled = true;
      say("Sending…", "info");
      fetch(ENQUIRY.endpoint, {
        method: "POST",
        body: new FormData(form),
        headers: { "Accept": "application/json" }
      }).then(function (res) {
        if (!res.ok) throw new Error("bad response");
        form.reset();
        say("Thank you! Your enquiry has been sent. We will be in touch.", "ok");
      }).catch(function () {
        say("Sorry, something went wrong. Please try again in a little while.", "error");
      }).then(function () { btn.disabled = false; });
    });
  }

  function ready() {
    try { fillSlots(); } catch (err) { if (window.console) console.error("Storybook pictures failed:", err); }
    initBook();
    initEnquiry();
  }

  window.sbInit = ready;

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ready);
  } else {
    ready();
  }
})();

</script>

   <div class=\"sb-art\" data-slot=\"home2\" data-alt=\"Rahul balances on stepping stones across a stream labelled Practical, Step by step and Connection while Anand waves from the far bank\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <h2 class=\"sb-heading\">Kannada that becomes part of life<\/h2>\n          <p class=\"sb-lead\">Kannada Journey is for anyone who wants to move beyond isolated words and start using Kannada in real situations.<\/p>\n          <div class=\"sb-cards\">\n            <div class=\"sb-card\"><h3 class=\"sb-card__title\">Practical from the start<\/h3><p>Learn useful sentences and expressions you can use in daily life.<\/p><\/div>\n            <div class=\"sb-card\"><h3 class=\"sb-card__title\">Step by step<\/h3><p>Progress through clear programs without being overwhelmed by grammar.<\/p><\/div>\n            <div class=\"sb-card\"><h3 class=\"sb-card__title\">Made for connection<\/h3><p>Build the confidence to speak with people, not merely study a language.<\/p><\/div>\n          <\/div>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>Between Rahul and the village runs a stream, with three stones to step on.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Each stone is a promise: Kannada you can use today, one step at a time, with people waiting on the far bank.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Useful words, a gentle pace, and people to talk to. I can do that.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Starting point\" id=\"start\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"home3\" data-alt=\"A signpost with six arrows, one for each program, with Rahul and Anand standing beside it\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h2 class=\"sb-heading\">Find your starting point<\/h2>\n          <p class=\"sb-lead\">Explore six programs, from your first sentences to richer expression. Learn what each stage aims to develop.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>At the crossroads stands a signpost with six arrows. Every traveller begins at a different one.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Some begin at the first arrow, others a little further along. Tell me where you are, and we’ll find your starting point.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Six arrows, and one road. I’ll start where I stand.”<\/p><\/div>\n          <\/div>\n          <div class=\"sb-actions\">\n            <a class=\"sb-btn\" href=\"contact.html\">Ask about joining<\/a>\n            <a class=\"sb-btn sb-btn--ghost\" href=\"programs.html\">Explore programs<\/a>\n          <\/div>\n          <button class=\"sb-link\" type=\"button\" data-sb-first>Read the story again<\/button>\n        <\/div>\n      <\/section>\n\n    <\/div>\n\n    \n    <nav class=\"sb-controls\" aria-label=\"Storybook pages\">\n      <button class=\"sb-turn\" type=\"button\" data-sb-prev aria-label=\"Previous page\">‹<\/button>\n      <ol class=\"sb-dots\" id=\"sbDots\"><\/ol>\n      <button class=\"sb-turn\" type=\"button\" data-sb-next aria-label=\"Next page\">›<\/button>\n    <\/nav>\n    <p class=\"sb-counter\" id=\"sbCounter\" aria-live=\"polite\"><\/p>\n  ", "programs.html": "\n    <div class=\"sb-book\" id=\"sbBook\" tabindex=\"-1\">\n\n      \n      <section class=\"sb-spread\" data-title=\"Cover\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"cover\" data-alt=\"Anand the teacher and Rahul the learner set off along a path toward a rising sun\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <p class=\"sb-kicker\">Six-program pathway<\/p>\n          <h1 class=\"sb-title\">A six-program pathway from first spoken sentences to confident, expressive Kannada.<\/h1>\n          <p class=\"sb-lead\">Each program has its own practical outcome. Learners may enrol in one or more programs, while higher programs require completion of the preceding foundation.<\/p>\n          <p class=\"sb-story\">Meet <strong>Anand<\/strong>, the teacher, and <strong>Rahul<\/strong>, the traveller. Turn the page and follow their journey, one chapter at a time.<\/p>\n          <button class=\"sb-btn sb-btn--start\" type=\"button\" data-sb-next>Begin the journey<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program overview\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"overview\" data-alt=\"A winding road with six numbered milestones; Anand and Rahul stand at the start\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <h2 class=\"sb-heading\">Program overview<\/h2>\n          <p class=\"sb-lead\">Programs 1–2 focus on first spoken sentences and everyday use; Programs 3–4 introduce how Kannada works and how to express actions clearly; Programs 5–6 develop richer conversations and real-world expression.<\/p>\n          <ol class=\"sb-route\"><li><span>Program 1<\/span> Start speaking: simple, everyday sentences, and the Kannada letters.<\/li><li><span>Program 2<\/span> Use Kannada everywhere: talk about anyone, anything, yesterday and tomorrow.<\/li><li><span>Program 3<\/span> Understand how it really works: how speech turns into correct writing.<\/li><li><span>Program 4<\/span> Say what is happening now, what is finished, and what you have experienced.<\/li><li><span>Program 5<\/span> Complete the toolkit: longer, richer sentences for speaking and writing.<\/li><li><span>Program 6<\/span> Grow your words and perform: vocabulary through themes, news, films and acting.<\/li><\/ol>\n          <p class=\"sb-story\">Six chapters. One road. Each chapter leaves Rahul able to do something real.<\/p>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 1\" id=\"program-1\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"program1\" data-alt=\"On a sunlit veranda Anand traces the first Kannada letter on a slate while Rahul points to himself; scroll tags float above\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Program 1<\/p>\n          <h2 class=\"sb-heading\"><span class=\"sb-heading__main\">Kannada First Steps<\/span> <span class=\"sb-heading__sub\">Your First Real Sentences<\/span><\/h2>\n          <p class=\"sb-tagline\">“From zero to speaking in one month.”<\/p>\n          <p class=\"sb-lead\">Read and write the Kannada letters, and start speaking in simple everyday sentences.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>The journey begins at the very root of the language. Rahul learns the shapes of the Kannada letters while finding the power of his own voice: saying what he does, asking questions, saying what he won’t do, and politely asking others to do things.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Look closely at these curves, Rahul. This script is your foundation. Now, let us build your very first sentences around yourself. Learn to say what you do, how to ask a question, how to say what you will not do, and how to politely ask someone to do something.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Ah, I see! With the letters and my own sentences (‘I go to the office’, ‘I will not go’, ‘Will you go?’), I can manage my everyday needs from day one!”<\/p><\/div>\n          <\/div>\n          <button class=\"sb-btn sb-btn--ghost sb-btn--small\" type=\"button\" data-sb-next>What you’ll learn<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 1: details\" id=\"program-1-details\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-slate\">\n            <p class=\"sb-slate__title\">First sentences<\/p>\n            <p class=\"sb-slate__sub\">Letters, and sentences you can use today<\/p>\n            <ul class=\"sb-slate__list\"><li><span class=\"sb-slate__kn\">ಅ     ಆ<\/span><span class=\"sb-slate__en\">The first two letters: read them, write them<\/span><\/li><li><span class=\"sb-slate__kn\">Naanu office-ge hogteeni<\/span><span class=\"sb-slate__en\">I go to the office<\/span><\/li><li><span class=\"sb-slate__kn\">Neenu hogteeya?<\/span><span class=\"sb-slate__en\">Will you go?<\/span><\/li><li><span class=\"sb-slate__kn\">Naanu hogalla<\/span><span class=\"sb-slate__en\">I will not go<\/span><\/li><li><span class=\"sb-slate__kn\">Naanu coffee kudiyalla<\/span><span class=\"sb-slate__en\">I will not drink coffee<\/span><\/li><li><span class=\"sb-slate__kn\">Hogu<\/span><span class=\"sb-slate__en\">Go! (to a friend)<\/span><\/li><li><span class=\"sb-slate__kn\">Neevu banni<\/span><span class=\"sb-slate__en\">Please come (politely)<\/span><\/li><\/ul>\n            <p class=\"sb-slate__note\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Program 1 · Kannada First Steps<\/p>\n          <h2 class=\"sb-heading\">What you will learn<\/h2>\n          <p class=\"sb-lead\">Program 1 teaches by patterns first. You will not study how every word is built yet. Instead, you pick up sentences that people really say, and practise them until they feel natural. Reading and writing the letters grow alongside, but the main goal is to speak.<\/p>\n          <ul class=\"sb-bullets\"><li>Read and write the Kannada letters, starting from the very first one, ಅ.<\/li><li>Say what you do: “I go to the office.”<\/li><li>Ask a question: “Will you go?”<\/li><li>Say what you won’t do: “I will not go to the office.” “I will not drink coffee.”<\/li><li>Politely ask someone to do something (“Please come”), or tell a friend (“Go!”).<\/li><\/ul>\n          <h3 class=\"sb-subhead\">By the end, you can<\/h3>\n          <ul class=\"sb-bullets\"><li>Read and write simple Kannada words and sentences.<\/li><li>Use words like “I” and “you” in everyday sentences.<\/li><li>Give a simple request or instruction, and ask a simple question.<\/li><li>Say what you will not do, and answer questions about it.<\/li><li>Speak in short, useful sentences about what you do, and what you will do.<\/li><\/ul>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 2\" id=\"program-2\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"program2\" data-alt=\"A village market; Anand points at people while a glowing Matrix Map links Rahul to He, She, It, They, We and You\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Program 2<\/p>\n          <h2 class=\"sb-heading\"><span class=\"sb-heading__main\">Kannada in Context<\/span> <span class=\"sb-heading__sub\">Use Kannada Everywhere<\/span><\/h2>\n          <p class=\"sb-tagline\">“From simple sentences to real-life Kannada.”<\/p>\n          <p class=\"sb-lead\">Stretch your sentences to talk about anyone, anything and any time: people, places, things, yesterday and tomorrow.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>The world expands as the traveler moves beyond himself. Anand unlocks the master key of Kannada conversation: making your sentence fit every person, every group, and every link between things, whether it happened yesterday or will happen tomorrow.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“In Program 1, you learned to speak for yourself. Now, look at the market! To converse truly, you must speak about others and about the world around you. Watch how a sentence changes naturally depending on whether you talk about a man, a woman, a group, or an elder, and whether it happened yesterday or will happen tomorrow.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“This changes everything! Now that I can fit my speech to anyone and anything, I can step out of my own bubble and have real, meaningful conversations with anyone I meet on the street!”<\/p><\/div>\n          <\/div>\n          <button class=\"sb-btn sb-btn--ghost sb-btn--small\" type=\"button\" data-sb-next>What you’ll learn<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 2: details\" id=\"program-2-details\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-slate\">\n            <p class=\"sb-slate__title\">Anyone, anything, any time<\/p>\n            <p class=\"sb-slate__sub\">The same pattern, stretched<\/p>\n            <ul class=\"sb-slate__list\"><li><span class=\"sb-slate__kn\">Avanu bartaane<\/span><span class=\"sb-slate__en\">He will come<\/span><\/li><li><span class=\"sb-slate__kn\">Avalu bartaale<\/span><span class=\"sb-slate__en\">She will come<\/span><\/li><li><span class=\"sb-slate__kn\">Avaru bartaare<\/span><span class=\"sb-slate__en\">They will come<\/span><\/li><li><span class=\"sb-slate__kn\">Manege hode<\/span><span class=\"sb-slate__en\">I went to the house<\/span><\/li><li><span class=\"sb-slate__kn\">Avana jote bande<\/span><span class=\"sb-slate__en\">I came with him<\/span><\/li><li><span class=\"sb-slate__kn\">Avanige kotte<\/span><span class=\"sb-slate__en\">I gave it to him<\/span><\/li><li><span class=\"sb-slate__kn\">Naale hogteeni<\/span><span class=\"sb-slate__en\">I will go tomorrow<\/span><\/li><\/ul>\n            <p class=\"sb-slate__note\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Program 2 · Kannada in Context<\/p>\n          <h2 class=\"sb-heading\">What you will learn<\/h2>\n          <p class=\"sb-lead\">Program 2 takes your Program 1 sentences and stretches them to everything around you. You still learn through patterns, not rule lists, so you can speak first and understand the reasons later.<\/p>\n          <ul class=\"sb-bullets\"><li>Talk about anyone: he, she, they, we, an elder, a whole group. The sentence changes to match who you mean.<\/li><li>Use the small endings that show how things connect: to the house, from the house, in the house, with a friend, his book, “I gave it to him”.<\/li><li>Talk about yesterday and tomorrow, as well as today.<\/li><li>Ask, say, say “not”, and request politely, in all of these situations.<\/li><\/ul>\n          <h3 class=\"sb-subhead\">By the end, you can<\/h3>\n          <ul class=\"sb-bullets\"><li>Talk about people, things, places, who owns what, and who receives what.<\/li><li>Handle everyday situations: the market, the bus, a neighbour’s doorway.<\/li><li>Speak about the past, the present and the future.<\/li><li>Do all this without having to work out the rules behind it.<\/li><\/ul>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 3\" id=\"program-3\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"program3\" data-alt=\"In a library veranda Anand and Rahul sit on a straw mat; a slate links spoken and written Kannada; a brass lamp glows\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Program 3<\/p>\n          <h2 class=\"sb-heading\"><span class=\"sb-heading__main\">Kannada with Clarity<\/span> <span class=\"sb-heading__sub\">Understand How It Really Works<\/span><\/h2>\n          <p class=\"sb-tagline\">“From patterns to proper grammar.”<\/p>\n          <p class=\"sb-lead\">Understand why Kannada sentences are built the way they are, and how everyday speech turns into correct written Kannada.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>As the spoken word becomes comfortable, the traveler seeks the hidden logic of the script. The written language stands ready to act as a perfect mirror.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Now that your tongue knows the paths, let us unlock the structure of the script. Written grammar isn’t a weapon to grade you—it is a map that reveals exactly why we say what we say.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Ah! Seeing how the spoken and written forms connect makes everything click. The structure feels incredibly clear now.”<\/p><\/div>\n          <\/div>\n          <button class=\"sb-btn sb-btn--ghost sb-btn--small\" type=\"button\" data-sb-next>What you’ll learn<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 3: details\" id=\"program-3-details\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-slate\">\n            <p class=\"sb-slate__title\">Spoken → Written<\/p>\n            <p class=\"sb-slate__sub\">Same meaning, two ways of saying it<\/p>\n            <ul class=\"sb-slate__list\"><li><span class=\"sb-slate__kn\">hogteeni  →  hoguttene<\/span><span class=\"sb-slate__en\">I go / I will go<\/span><\/li><li><span class=\"sb-slate__kn\">barteeni  →  baruttene<\/span><span class=\"sb-slate__en\">I come / I will come<\/span><\/li><li><span class=\"sb-slate__kn\">maadteeni  →  maaduttene<\/span><span class=\"sb-slate__en\">I do / I will do<\/span><\/li><li><span class=\"sb-slate__kn\">avru  →  avaru<\/span><span class=\"sb-slate__en\">They (or he, respectfully)<\/span><\/li><li><span class=\"sb-slate__kn\">avananna  →  avanannu<\/span><span class=\"sb-slate__en\">Him<\/span><\/li><\/ul>\n            <p class=\"sb-slate__note\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Program 3 · Kannada with Clarity<\/p>\n          <h2 class=\"sb-heading\">What you will learn<\/h2>\n          <p class=\"sb-lead\">Program 3 opens the box. You already speak in patterns. Now you learn why the patterns look the way they do, and how the same sentence is written in books.<\/p>\n          <ul class=\"sb-bullets\"><li>How everyday speech becomes correct written Kannada: “hogteeni” (spoken) becomes “hoguttene” (written).<\/li><li>How a word changes when you say to, from, in, with or of, and how to build those forms yourself.<\/li><li>The “base word” of an action (like “hogu”, meaning “go”), and how the endings added to it tell you who is doing it and when.<\/li><li>Everything from Program 2, revisited with the reasons behind it.<\/li><\/ul>\n          <h3 class=\"sb-subhead\">By the end, you can<\/h3>\n          <ul class=\"sb-bullets\"><li>Build correct written forms of words and actions yourself, instead of memorising each one.<\/li><li>Tell the spoken form from the written form, and move between them.<\/li><li>Read and write more accurately.<\/li><li>Keep speaking naturally while you do it.<\/li><\/ul>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 4\" id=\"program-4\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"program4\" data-alt=\"In a pavilion framed by stone arches Anand holds two hourglasses, one still running and one finished, while Rahul tells a story with wide gestures\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Program 4<\/p>\n          <h2 class=\"sb-heading\"><span class=\"sb-heading__main\">Kannada in Flow<\/span> <span class=\"sb-heading__sub\">Express Ongoing and Completed Actions<\/span><\/h2>\n          <p class=\"sb-tagline\">“From basic actions to saying exactly when and how things happen.”<\/p>\n          <p class=\"sb-lead\">Say exactly what is happening now, what is finished, and what you have experienced.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>With structural keys in hand, the student learns to weave time into language. Actions come alive in flowing arcs and finished experiences.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“A language has true movement when you can describe time. Let us expand your speech so you can effortlessly talk about things you are doing right now, things you have finished, and the experiences you’ve had.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“I’m no longer trapped in the immediate present! I can tell people where I have been and what I am planning to build tomorrow.”<\/p><\/div>\n          <\/div>\n          <button class=\"sb-btn sb-btn--ghost sb-btn--small\" type=\"button\" data-sb-next>What you’ll learn<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 4: details\" id=\"program-4-details\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-slate\">\n            <p class=\"sb-slate__title\">Now, finished, experienced<\/p>\n            <p class=\"sb-slate__sub\">Three different stages of an action<\/p>\n            <ul class=\"sb-slate__list\"><li><span class=\"sb-slate__kn\">Oota maadta iddeeni<\/span><span class=\"sb-slate__en\">I am eating (right now)<\/span><\/li><li><span class=\"sb-slate__kn\">hogta iddeeni  →  hogutiddene<\/span><span class=\"sb-slate__en\">I am going (spoken → written)<\/span><\/li><li><span class=\"sb-slate__kn\">hogiddeeni  →  hogiddene<\/span><span class=\"sb-slate__en\">I have gone (spoken → written)<\/span><\/li><li><span class=\"sb-slate__kn\">Mysuruge hogiddeeni<\/span><span class=\"sb-slate__en\">I have been to Mysuru<\/span><\/li><li><span class=\"sb-slate__kn\">Baagilu teredide<\/span><span class=\"sb-slate__en\">The door is open (someone opened it)<\/span><\/li><\/ul>\n            <p class=\"sb-slate__note\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Program 4 · Kannada in Flow<\/p>\n          <h2 class=\"sb-heading\">What you will learn<\/h2>\n          <p class=\"sb-lead\">Program 4 is about time and stage: is the action happening now, is it finished, or is it an experience you carry with you? You learn each in everyday speech and in careful written Kannada.<\/p>\n          <ul class=\"sb-bullets\"><li>Things happening right now: “I am eating.” “She is reading.”<\/li><li>Things that are finished: “I have eaten.” “I have finished the work.”<\/li><li>Experiences, and what an action leaves behind: “I have been to Mysuru.” “The door is open.”<\/li><li>How these differ from plain “I eat” and “I ate”.<\/li><li>How casual talk and formal writing say these things a little differently.<\/li><\/ul>\n          <h3 class=\"sb-subhead\">By the end, you can<\/h3>\n          <ul class=\"sb-bullets\"><li>Say what is going on now, what is finished, and what you have experienced.<\/li><li>Use all of these in speaking and in writing.<\/li><li>Tell the difference in meaning between “I eat”, “I am eating” and “I have eaten”.<\/li><li>Read and write sentences that use them.<\/li><\/ul>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 5\" id=\"program-5\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"program5\" data-alt=\"Under a banyan tree with fairylights Rahul talks with a circle of locals while Anand watches proudly with arms crossed; a tea stall steams nearby\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Program 5<\/p>\n          <h2 class=\"sb-heading\"><span class=\"sb-heading__main\">Rich Conversations<\/span> <span class=\"sb-heading__sub\">Beyond Simple Sentences<\/span><\/h2>\n          <p class=\"sb-tagline\">“Complete grammar for both spoken and written Kannada.”<\/p>\n          <p class=\"sb-lead\">Go beyond simple sentences to longer, richer ones, for natural speech and for writing.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>The basic tracks fade as deeper structures take root. The traveler steps beyond functional transactions into the realm of natural, complex dialogue.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“You have passed the boundary of basic survival, Rahul. Now we layer advanced sentence structures, helping your speech flow naturally without any mechanical pauses.”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“It feels incredible. I am no longer mentally translating every single word block from English in my head before I open my mouth. The conversation is just flowing!”<\/p><\/div>\n          <\/div>\n          <button class=\"sb-btn sb-btn--ghost sb-btn--small\" type=\"button\" data-sb-next>What you’ll learn<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 5: details\" id=\"program-5-details\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-slate\">\n            <p class=\"sb-slate__title\">Longer, richer sentences<\/p>\n            <p class=\"sb-slate__sub\">Joining ideas, joining words<\/p>\n            <ul class=\"sb-slate__list\"><li><span class=\"sb-slate__kn\">Ninne banda vyakti nanna chikkappa<\/span><span class=\"sb-slate__en\">The man who came yesterday is my uncle<\/span><\/li><li><span class=\"sb-slate__kn\">Male bandiddarinda maneyalle idde<\/span><span class=\"sb-slate__en\">Because it rained, I stayed home<\/span><\/li><li><span class=\"sb-slate__kn\">Oota maadi hogteeni<\/span><span class=\"sb-slate__en\">I will eat and then go<\/span><\/li><li><span class=\"sb-slate__kn\">mattu · aadare · aaddarinda<\/span><span class=\"sb-slate__en\">and · but · so<\/span><\/li><li><span class=\"sb-slate__kn\">mane + inda = maneyinda<\/span><span class=\"sb-slate__en\">Sounds blend when words meet<\/span><\/li><li><span class=\"sb-slate__kn\">tande + taayi = tandetaayi<\/span><span class=\"sb-slate__en\">Two words fused into one: father and mother<\/span><\/li><\/ul>\n            <p class=\"sb-slate__note\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Program 5 · Rich Conversations<\/p>\n          <h2 class=\"sb-heading\">What you will learn<\/h2>\n          <p class=\"sb-lead\">By now your toolkit is strong, but real Kannada also has long sentences, formal writing and small linking words. Program 5 fills those gaps, through conversations, explanations, stories, letters, essays and passages like those in school textbooks. It is for speaking as well as writing.<\/p>\n          <ul class=\"sb-bullets\"><li>Joining ideas into one sentence: “The man who came yesterday is my uncle.” “Because it rained, I stayed home.”<\/li><li>Small linking words that never change, like and, but, so and also.<\/li><li>How sounds blend when words meet: “mane” + “inda” becomes “maneyinda” (from the house).<\/li><li>Two words fused into one: “tande” (father) + “taayi” (mother) becomes “tandetaayi” (father and mother).<\/li><li>Saying the same thing in a different way: rewriting a sentence without changing its meaning.<\/li><\/ul>\n          <h3 class=\"sb-subhead\">By the end, you can<\/h3>\n          <ul class=\"sb-bullets\"><li>Understand and make longer, richer sentences in speech and in writing.<\/li><li>Use linking words, blended sounds and fused words correctly.<\/li><li>Rewrite sentences in other ways.<\/li><li>Speak naturally, without big gaps in the basics.<\/li><\/ul>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 6\" id=\"program-6\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"program6\" data-alt=\"On a community stage Rahul performs with a script scroll before a red curtain and cheering alumni, lit by a projector beam; Anand claps in the front row\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Program 6<\/p>\n          <h2 class=\"sb-heading\"><span class=\"sb-heading__main\">Unstoppable<\/span> <span class=\"sb-heading__sub\">Your Stage is Ready – Perform<\/span><\/h2>\n          <p class=\"sb-tagline\">“Systematic vocabulary building through immersion and expression.”<\/p>\n          <p class=\"sb-lead\">Build a wide, living vocabulary through themes, newspapers, films, roleplay, acting and discussion.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>The final peak is reached not through isolated study, but through absolute immersion in the local culture. The traveler is now a true citizen of the community.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Your stage is ready, perform! Immerse yourself completely in local newspapers, watch local films, argue the news, and act out scripts. The more you see, hear, and perform, the more effortless your language becomes!”<\/p><\/div>\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“The heavy struggle is completely gone. I don’t feel like an outsider visiting a new place anymore... I finally feel a deep, real sense of belonging!”<\/p><\/div>\n          <\/div>\n          <button class=\"sb-btn sb-btn--ghost sb-btn--small\" type=\"button\" data-sb-next>What you’ll learn<\/button>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Program 6: details\" id=\"program-6-details\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-slate\">\n            <p class=\"sb-slate__title\">Words for real life<\/p>\n            <p class=\"sb-slate__sub\">Themes you will build, one by one<\/p>\n            <ul class=\"sb-slate__list\"><li><span class=\"sb-slate__kn\">ondu · eradu · mooru<\/span><span class=\"sb-slate__en\">Numbers: one, two, three… up to 100 and beyond<\/span><\/li><li><span class=\"sb-slate__kn\">Eega gante eshtu?<\/span><span class=\"sb-slate__en\">Time: What time is it now?<\/span><\/li><li><span class=\"sb-slate__kn\">amma · appa · anna · tangi<\/span><span class=\"sb-slate__en\">Family: mother, father, elder brother, younger sister<\/span><\/li><li><span class=\"sb-slate__kn\">kempu · hasiru · neeli<\/span><span class=\"sb-slate__en\">Colours: red, green, blue<\/span><\/li><li><span class=\"sb-slate__kn\">eda · bala · nera<\/span><span class=\"sb-slate__en\">Directions: left, right, straight<\/span><\/li><li><span class=\"sb-slate__kn\">Ivattu male bartide<\/span><span class=\"sb-slate__en\">Weather: It is raining today<\/span><\/li><li><span class=\"sb-slate__kn\">Sahaaya maadi!<\/span><span class=\"sb-slate__en\">Emergencies: Help!<\/span><\/li><\/ul>\n            <p class=\"sb-slate__note\">Kannada is shown in English letters, so you can say it aloud.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Program 6 · Unstoppable<\/p>\n          <h2 class=\"sb-heading\">What you will learn<\/h2>\n          <p class=\"sb-lead\">Program 6 is where words take over from rules. You build vocabulary theme by theme, then live in Kannada: reading, listening and performing.<\/p>\n          <ul class=\"sb-bullets\"><li>Word themes: numbers (1 to 100, first, second, third, and big numbers), time, dates, family, body parts, colours, directions, weather, food, shopping and emergencies, with the phrases that naturally go together and small practical tasks.<\/li><li>Real Kannada: newspapers and articles, news clips, film scenes, interviews and stories.<\/li><li>Doing: roleplay, acting, discussions, talking about your own experiences, reviews, reflections and short pieces of writing.<\/li><li>New words, sayings and proverbs, picked up from context.<\/li><\/ul>\n          <h3 class=\"sb-subhead\">By the end, you can<\/h3>\n          <ul class=\"sb-bullets\"><li>Use practical words across the important parts of everyday life.<\/li><li>Speak about real-life subjects.<\/li><li>Understand new words from the way they are used.<\/li><li>Take part in roleplays, acting and discussions.<\/li><li>Express yourself with more variety, confidence and range, in speaking and in writing, and keep your vocabulary growing.<\/li><\/ul>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Join\" id=\"join\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"finale\" data-alt=\"Anand and Rahul wave from in front of a village gate with a welcoming lamp\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h2 class=\"sb-heading\">Your chapter is waiting.<\/h2>\n          <p class=\"sb-lead\">From first words to real belonging.<\/p>\n          <div class=\"sb-actions\">\n            <a class=\"sb-btn\" href=\"contact.html\">Ask about joining<\/a>\n            <a class=\"sb-btn sb-btn--ghost\" href=\"who-its-for.html\">See who it’s for<\/a>\n          <\/div>\n          <button class=\"sb-link\" type=\"button\" data-sb-first>Read the story again<\/button>\n        <\/div>\n      <\/section>\n\n    <\/div>\n\n    \n    <nav class=\"sb-controls\" aria-label=\"Storybook pages\">\n      <button class=\"sb-turn\" type=\"button\" data-sb-prev aria-label=\"Previous page\">‹<\/button>\n      <ol class=\"sb-dots\" id=\"sbDots\"><\/ol>\n      <button class=\"sb-turn\" type=\"button\" data-sb-next aria-label=\"Next page\">›<\/button>\n    <\/nav>\n    <p class=\"sb-counter\" id=\"sbCounter\" aria-live=\"polite\"><\/p>\n  ", "who-its-for.html": "\n    <div class=\"sb-book\" id=\"sbBook\" tabindex=\"-1\">\n\n      \n      <section class=\"sb-spread\" data-title=\"Four travellers\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"who0\" data-alt=\"Four travellers arrive in the village square: a nurse, an IT professional, a yoga visitor and a family, with Anand welcoming them under a big tree\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <p class=\"sb-kicker\">Who it’s for<\/p>\n          <h1 class=\"sb-title\">Built for different lives, not one kind of learner.<\/h1>\n          <p class=\"sb-lead\">People come to Kannada for different reasons: work, care, family, yoga, travel, neighbourhood life, or a wish to connect more naturally with Karnataka. Kannada Journey begins with the situations that matter to you.<\/p>\n          <div class=\"sb-tabs\" role=\"group\" aria-label=\"Choose a traveller\">\n            <button class=\"sb-tab\" type=\"button\" data-sb-goto=\"1\">Healthcare professionals<\/button>\n            <button class=\"sb-tab\" type=\"button\" data-sb-goto=\"2\">IT and workplace professionals<\/button>\n            <button class=\"sb-tab\" type=\"button\" data-sb-goto=\"3\">Yoga learners and visitors<\/button>\n            <button class=\"sb-tab\" type=\"button\" data-sb-goto=\"4\">Residents, families, and everyday learners<\/button>\n          <\/div>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>At dusk, four travellers reach the village square, each with a different reason for coming. Anand welcomes them all.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“A nurse, a developer, a yoga learner, a family: you each carry a different reason. Tell me yours, and we begin there.”<\/p><\/div>\n            <div class=\"sb-line sb-line--guest\"><span class=\"sb-who\">Meera<\/span><p>“I only want to talk with my patients without feeling like a stranger.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Healthcare\" id=\"healthcare\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"whoHealth\" data-alt=\"In a hospital ward Meera the nurse greets an elderly patient in Kannada while Anand watches kindly from the side\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <p class=\"sb-chapter\">Traveller 1 · Meera<\/p>\n          <h2 class=\"sb-heading\">Kannada for healthcare professionals<\/h2>\n          <p class=\"sb-lead\">When patients and families are anxious, tired, unwell, or unfamiliar with English, even a few clear Kannada words can make care feel more respectful, reassuring, and human.<\/p>\n          <div class=\"sb-twocol\">\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What may matter to you<\/h3><ul><li>Introducing yourself and building early trust<\/li><li>Understanding simple patient and family responses<\/li><li>Asking about comfort, pain, food, movement, and routine needs<\/li><li>Giving simple, respectful instructions and reassurance<\/li><\/ul><\/div>\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What can open up<\/h3><ul><li>Warmer communication during everyday patient interactions<\/li><li>More confidence in clinics, wards, home visits, and community settings<\/li><li>Better connection with colleagues and local support staff<\/li><li>Less distance between professional care and human presence<\/li><\/ul><\/div>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--guest\"><span class=\"sb-who\">Meera<\/span><p>“Each morning I walk the ward, and the silence between us and the patient feels so heavy.”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“A greeting, a question about comfort, a gentle instruction. Small words can close a very large distance.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"IT & workplace\" id=\"workplace\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"whoIT\" data-alt=\"In an office Arjun, wearing a staff badge, talks with a colleague about when the meeting is, with a clock showing three\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Traveller 2 · Arjun<\/p>\n          <h2 class=\"sb-heading\">Kannada for IT and workplace professionals<\/h2>\n          <p class=\"sb-lead\">In a team that shares many languages, a little Kannada can turn colleagues into friends and a workplace into a community.<\/p>\n          <div class=\"sb-twocol\">\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What may matter to you<\/h3><ul><li>Greeting colleagues and making small talk at the desk<\/li><li>Understanding everyday workplace phrases<\/li><li>Chatting with drivers, cooks, and local support staff<\/li><li>Handling daily commutes, errands, and neighbourhood life<\/li><\/ul><\/div>\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What can open up<\/h3><ul><li>Warmer relationships with local colleagues<\/li><li>More confidence outside the office<\/li><li>A stronger sense of belonging in the city<\/li><li>Less reliance on English alone<\/li><\/ul><\/div>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--guest\"><span class=\"sb-who\">Arjun<\/span><p>“My team chats in Kannada over tea, and I just smile and nod.”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Start with the small things: greetings, times, a question about the plan. Soon you won’t only smile and nod.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Yoga\" id=\"yoga\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"whoYoga\" data-alt=\"In a sunrise yoga hall Sofia sits on a mat while her teacher invites her to breathe out in Kannada\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Traveller 3 · Sofia<\/p>\n          <h2 class=\"sb-heading\">Kannada for yoga learners and visitors<\/h2>\n          <p class=\"sb-lead\">Yoga spaces are places of listening. Even a few Kannada words can help you follow, connect, and feel welcome.<\/p>\n          <div class=\"sb-twocol\">\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What may matter to you<\/h3><ul><li>Greeting teachers and fellow practitioners<\/li><li>Understanding simple instructions and guidance<\/li><li>Asking questions politely<\/li><li>Sharing a few words about your practice<\/li><\/ul><\/div>\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What can open up<\/h3><ul><li>Deeper connection with teachers and the local community<\/li><li>Greater ease during classes and retreats<\/li><li>Respectful, warm conversations<\/li><li>A richer experience of the place where you practise<\/li><\/ul><\/div>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--guest\"><span class=\"sb-who\">Sofia<\/span><p>“In class I follow the poses, but I miss the words around them.”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“A few Kannada words (breathe in, breathe out, yes) can bring you closer to your teacher and the place.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Residents & families\" id=\"families\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"whoFamily\" data-alt=\"In a village lane a neighbour admires a family's small child while Anand smiles nearby\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          \n          <p class=\"sb-chapter\">Traveller 4 · Neha and family<\/p>\n          <h2 class=\"sb-heading\">Kannada for residents, families, and everyday learners<\/h2>\n          <p class=\"sb-lead\">Home is where language lives. Kannada helps you greet neighbours, support your children, and take part in the life of the place you live.<\/p>\n          <div class=\"sb-twocol\">\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What may matter to you<\/h3><ul><li>Greeting neighbours and building friendly routines<\/li><li>Talking with shopkeepers, auto drivers, and helpers<\/li><li>Supporting children who hear Kannada at school<\/li><li>Joining festivals and community moments<\/li><\/ul><\/div>\n            <div class=\"sb-list\"><h3 class=\"sb-list__title\">What can open up<\/h3><ul><li>Warmer ties with neighbours<\/li><li>Confidence in daily errands and conversations<\/li><li>A shared language at home and in school life<\/li><li>Feeling more rooted in the community<\/li><\/ul><\/div>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--guest\"><span class=\"sb-who\">Neha<\/span><p>“My daughter hears Kannada at school, and I can’t answer her questions.”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“Then begin with the lane outside your door. Neighbours make the best teachers.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"Join\" id=\"join\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"finale\" data-alt=\"The village gate with a welcoming lamp, and Anand and Rahul waving\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <h2 class=\"sb-heading\">Your reason is welcome here.<\/h2>\n          <p class=\"sb-lead\">Kannada Journey begins with the situations that matter to you.<\/p>\n          <div class=\"sb-actions\">\n            <a class=\"sb-btn\" href=\"programs.html\">Explore programs<\/a>\n            <a class=\"sb-btn sb-btn--ghost\" href=\"contact.html\">Ask about joining<\/a>\n          <\/div>\n          <button class=\"sb-link\" type=\"button\" data-sb-first>Read the story again<\/button>\n        <\/div>\n      <\/section>\n\n    <\/div>\n\n    \n    <nav class=\"sb-controls\" aria-label=\"Storybook pages\">\n      <button class=\"sb-turn\" type=\"button\" data-sb-prev aria-label=\"Previous page\">‹<\/button>\n      <ol class=\"sb-dots\" id=\"sbDots\"><\/ol>\n      <button class=\"sb-turn\" type=\"button\" data-sb-next aria-label=\"Next page\">›<\/button>\n    <\/nav>\n    <p class=\"sb-counter\" id=\"sbCounter\" aria-live=\"polite\"><\/p>\n  ", "how-it-works.html": "\n    <div class=\"sb-book\" id=\"sbBook\" tabindex=\"-1\">\n\n      \n      <section class=\"sb-spread\" data-title=\"The path\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"how0\" data-alt=\"A signpost with three stage boards, with Rahul and Anand beside it\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text sb-page--cover\">\n          <p class=\"sb-kicker\">How it works<\/p>\n          <h1 class=\"sb-title\">A clear path, not a heavy syllabus.<\/h1>\n          <p class=\"sb-lead\">Kannada Journey is designed as a sequence of small, practical steps. You start with useful everyday language and gradually build towards clearer expression and deeper understanding.<\/p>\n          <div class=\"sb-scroll\">\n            <p class=\"sb-scroll__label\">Narrator Scroll<\/p>\n            <p>Rahul expects a mountain of rules. Instead, Anand points him to a signpost with three stages.<\/p>\n          <\/div>\n          <div class=\"sb-dialogue\">\n            <div class=\"sb-line sb-line--rahul\"><span class=\"sb-who\">Rahul<\/span><p>“Is this going to be a heavy syllabus?”<\/p><\/div>\n            <div class=\"sb-line sb-line--anand\"><span class=\"sb-who\">Anand<\/span><p>“No. Small, practical steps, one after another.”<\/p><\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      \n      <section class=\"sb-spread\" data-title=\"What to expect\">\n        <div class=\"sb-page sb-page--art\">\n          <div class=\"sb-art\" data-slot=\"how1\" data-alt=\"A row of places where Kannada is used: a clinic, a café, a yoga space, a market and a home, with Rahul and Anand walking past\">\n            <p class=\"sb-art__fallback\">The picture goes here. If you only see this message, upload <strong>storybook.js<\/strong> next to this page.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"sb-page sb-page--text\">\n          <h2 class=\"sb-heading\">What you can expect<\/h2>\n          <p class=\"sb-lead\">The focus is on language you can actually use: at work, in neighbourhoods, clinics, cafés, yoga spaces, markets, homes, and everyday moments.<\/p>\n          <div class=\"sb-cards\">\n            <div cla
